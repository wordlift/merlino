name: Publish Merlino KG Atlas

on:
  push:
    branches: [main]
    paths:
      - docs/merlino-kg-atlas.html
      - .github/workflows/deploy-atlas.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Atlas-only site
        run: |
          mkdir -p _site
          cp docs/merlino-kg-atlas.html _site/index.html
          cp docs/merlino-kg-atlas.html _site/merlino-kg-atlas.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Atlas
        id: deployment
        uses: actions/deploy-pages@v4
