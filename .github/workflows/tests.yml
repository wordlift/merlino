name: Merlino CPU validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ontology-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests including real PySHACL integration
        run: python -m pytest -q -ra
      - name: Notebook embedded bundle passes same regression suite
        run: |
          python - <<'PY'
          import json, pathlib, sys, subprocess
          notebook = json.loads(pathlib.Path('notebooks/Merlino_Gemma4_AOOE_Workshop.ipynb').read_text())
          namespace = {'__name__': '__main__', 'sys': sys}
          exec(''.join(notebook['cells'][3]['source']), namespace)
          project = namespace['PROJECT']
          tests = ['tests/test_engine.py', 'tests/test_workshop_cases.py',
                   'tests/test_memory_and_bea_feedback.py', 'tests/test_episodic_experiment.py',
                   'tests/test_gemma_runtime_contract.py']
          subprocess.run([sys.executable, '-m', 'pytest', '-q', '-ra', *tests],
                         cwd=str(project), check=True)
          PY
      - name: Install notebook smoke-run dependencies
        if: matrix.python-version == '3.13'
        run: python -m pip install nbclient nbformat ipykernel ipywidgets
      - name: Run entire Colab notebook in clean CPU kernel
        if: matrix.python-version == '3.13'
        run: python scripts/verify_workshop_notebook.py
      - name: Notebook contains no saved outputs
        run: |
          python -c "import json,pathlib; n=json.loads(pathlib.Path('notebooks/Merlino_Gemma4_AOOE_Workshop.ipynb').read_text()); assert n['nbformat']==4; assert not [c for c in n['cells'] if c['cell_type']=='code' and c.get('outputs')]; print('Notebook verified')"
